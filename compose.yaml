services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped

    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --eval 'db.adminCommand({ ping: 1 })' admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-api
    restart: unless-stopped

    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI}
      # Flask краще слухати на 0.0.0.0 в контейнері
      HOST: 0.0.0.0
      PORT: 5000

    ports:
      - "5000:5000"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
